<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Dashboard</title>
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <div id="ask_name" role="dialog" aria-labelledby="ask-title">
    <h2 id="ask-title">Enter your name to get started.</h2>
    <label class="sr-only" for="name">Your name</label>
    <input type="text" id="name" autocomplete="given-name" />
    <button id="submit-name" type="button">Continue</button>
  </div>

  <h2 id="show-name" aria-live="polite"></h2>
  <h2 id="greeting" aria-live="polite"></h2>

  <div id="clock" class="panel hidden">
    <button class="drag-handle" id="clock-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move clock panel">⠿ Move</button>
    <label class="sr-only" for="the-actual-time">Timer</label>
    <input type="text" id="the-actual-time" value="24:00" spellcheck="false"
           inputmode="numeric" aria-live="off" />
    <div class="clock-buttons">
      <button id="start" type="button">Start</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>

  <div id="goals" class="panel hidden">
    <button class="drag-handle" id="goals-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move goals panel">⠿ Move</button>
    <div id="goal-list" aria-live="polite"></div>
    <p id="goal-empty" class="empty">No goals yet — add one below.</p>
    <div class="goal-add">
      <label class="sr-only" for="goal-input">New goal</label>
      <input type="text" id="goal-input" placeholder="Enter a goal" autocomplete="off" />
      <button id="add-goal" type="button">Add Goal</button>
    </div>
  </div>

  <div id="weather" class="panel hidden">
    <button class="drag-handle" id="weather-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move weather panel">⠿ Move</button>
    <div id="weather-content" aria-live="polite">
      <p class="empty">Loading weather...</p>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
