<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Dashboard</title>
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <div id="ask_name" role="dialog" aria-labelledby="ask-title">
    <h2 id="ask-title">Enter your name to get started.</h2>
    <label class="sr-only" for="name">Your name</label>
    <input type="text" id="name" autocomplete="given-name" />
    <button id="submit-name" type="button">Continue</button>
  </div>

  <h2 id="show-name" aria-live="polite"></h2>
  <h2 id="greeting" aria-live="polite"></h2>

  <div id="clock" class="panel hidden">
    <button class="drag-handle" id="clock-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move clock panel">⠿ Move</button>
    
    <div class="timer-face">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="timer-track" cx="60" cy="60" r="54" />
        <circle
          id="timer-progress"
          class="timer-progress"
          cx="60"
          cy="60"
          r="54"
        />
      </svg>

      <div class="timer-content">
        <label class="sr-only" for="the-actual-time">
          Countdown time
        </label>

        <input
          type="text"
          id="the-actual-time"
          value="25:00"
          spellcheck="false"
          inputmode="numeric"
          aria-live="off"
        />

        <span class="timer-caption">FOCUS SESSION</span>
      </div>
    </div>

    <div class="clock-buttons">
      <button id="start" type="button">Start</button>
      <button id="reset" type="button">Reset</button>
    </div>

  </div>

  <div id="sessions" class="panel hidden">
    <button class="drag-handle" id="sessions-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move session history panel">⠿ Move</button>
    <h2>Session History</h2>

    <div class="session-stats">
      <div>
        <span id="focus-count">0</span><small>Focus sessions</small>
      </div>
      <div><span id="focus-minutes">0</span><small>Focus minutes</small></div>
    </div>

    <div id="session-list" aria-live="polite"><p class="empty">No completed sessions yet. Time to focus!</p></div>

    <button id="clear-sessions" type="button">Clear history</button>
  </div>

  <div id="goals" class="panel hidden">
    <button class="drag-handle" id="goals-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move goals panel">⠿ Move</button>
    <div id="progress-bar" aria-hidden="true"><div id="progress-fill"></div></div>
    <div id="goal-list" aria-live="polite"></div>
    <p id="goal-empty" class="empty">No goals yet — add one below.</p>
    <div class="goal-add">
      <label class="sr-only" for="goal-input">New goal</label>
      <input type="text" id="goal-input" placeholder="Enter a goal" autocomplete="off" />
      <button id="add-goal" type="button">Add Goal</button>
    </div>
  </div>

  <div id="weather" class="panel hidden">
    <button class="drag-handle" id="weather-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move weather panel">⠿ Move</button>
    <div id="weather-content" aria-live="polite">
      <p class="empty">Loading weather...</p>
    </div>
  </div>

  <div id="calender" class="panel hidden">
    <button class="drag-handle" id="calender-handle" title="Drag to move (arrow keys to nudge)" aria-label="Move calender panel">⠿ Move</button>
    <h2>📅 Calendar</h2>
    <details class="event-form-details">
      <summary>+ Add Event</summary>
        <form id="event-form">
          <label for="event-title">Event title</label>
          <input type="text" id="event-title" placeholder="eg. coding session" maxlength="120" required />
          <label for="event-date">Date</label>
          <input type="date" id="event-date" required />
          <label for="event-time">Start time</label>
          <input type="time" id="event-time" required />
          <label for="event-description">Description (optional)</label>
          <textarea id="event-description" placeholder="Add some details..." maxlength="1000" rows="3"></textarea>
          <button type="submit">Add event</button>
        </form>
        <p id="event-status" class="empty" aria-live="polite"></p>
    </details>
    <div class="calendar-header">
      <button id="calendar-prev" type="button" aria-label="Previous month">‹</button>
      <h3 id="calendar-month" aria-live="polite"></h3>
      <button id="calendar-next" type="button" aria-label="Next month">›</button>
    </div>
    <div class="calendar-weekdays" aria-hidden="true">
      <span>Mon</span>
      <span>Tue</span>
      <span>Wed</span>
      <span>Thu</span>
      <span>Fri</span>
      <span>Sat</span>
      <span>Sun</span>
    </div>
    <div id="calendar-grid" class="calendar-grid" aria-label="Choose a date"></div>
    <p id="calendar-selected-date" class="calendar-selected-date" aria-live="polite"></p>
    <div id="events" aria-live="polite">
      <p class="empty">No events scheduled, add one!</p>
    </div>
  </div>
  <!-- removed hackatime panel for now due to API CORS issues blocking my domain
  <div id="hackatime" class="panel hidden">
    <button class="drag-handle" id="hackatime-handle" title="Drag to move" aria-label="Move Hackatime panel">⠿ Move</button>
    <h2>⌨️ Hackatime Stats</h2>
    <p id="hackatime-status" role="status">Connect your Hackatime account to get started.</p>
    <button id="hackatime-connect" type="button">Connect Hackatime</button>
    <div id="hackatime-stats" hidden>
      <div class="hackatime-stat-grid">
        <div class="hackatime-stat">
          <span id="hackatime-hours">-</span>
          <small>Coding time - 7 days</small>
        </div>
        <div class="hackatime-stat">
          <span id="hackatime-streak">-</span>
          <small>Day streak</small>
        </div>
        <div class="hackatime-stat">
          <span id="hackatime-projects">-</span>
          <small>Projects</small>
        </div>
      </div>
      <p id="hackatime-user"></p>
      <p id="hackatime-latest"></p>
      <button id="hackatime-refresh" type="button">Refresh stats</button>
      <button id="hackatime-disconnect" type="button">Clear saved data</button>
    </div>
  -->
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
